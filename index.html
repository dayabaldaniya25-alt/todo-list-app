<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📝 My Tasks</h1>
      <p class="subtitle">Stay organized and productive</p>
    </header>

    <div class="input-section">
      <input 
        type="text" 
        id="taskInput" 
        placeholder="Add a new task..." 
        class="task-input"
      >
      <button id="addBtn" class="add-btn">Add Task</button>
    </div>

    <div class="filter-section">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <div class="stats-section">
      <span class="stat-item">Total: <span id="totalCount">0</span></span>
      <span class="stat-item">Active: <span id="activeCount">0</span></span>
      <span class="stat-item">Completed: <span id="completedCount">0</span></span>
    </div>

    <ul id="taskList" class="task-list">
      <li class="empty-state">No tasks yet. Add one to get started! 🚀</li>
    </ul>

    <div class="action-section">
      <button id="clearCompletedBtn" class="clear-btn">Clear Completed</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
